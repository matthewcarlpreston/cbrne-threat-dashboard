name: Update CBRN-E OSINT data

on:
  schedule:
    # Every 6 hours. GDELT's DOC 2.0 API is free/keyless -- this cadence is
    # intentionally conservative (see README "reasonable-use" note).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Optional. If unset, scripts/fetch_twitter.py no-ops (see its module
          # docstring) and the rest of the pipeline is unaffected. Uses the
          # counts/recent endpoint (7 categories x $0.005/request, flat --
          # not per-post) -- at this workflow's 6h cadence that's ~$0.14/day.
          # Lower the cron frequency above or remove this secret to cut spend.
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python scripts/build_json.py --hours 24 --retention-days 14

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
